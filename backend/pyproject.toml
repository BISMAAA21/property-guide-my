[project]
name = "fyp-property-guidance-api"
version = "0.1.0"
description = "AI API for the FYP property guidance Android application"
requires-python = ">=3.11,<3.14"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
